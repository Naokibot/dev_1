name: Saga external target validation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-d3d11:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: System evidence
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture,CsManufacturer,CsModel | Format-List
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build D3D11 probe
        shell: cmd
        run: cl /nologo /EHsc ci\windows_d3d11_probe.cpp /Fe:d3d11_probe.exe
      - name: Run D3D11 probe
        shell: cmd
        run: d3d11_probe.exe

  macos-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: System evidence
        run: |
          sw_vers
          uname -a
          system_profiler SPHardwareDataType || true
      - name: Build Metal probe
        run: clang++ -std=c++17 -fobjc-arc ci/macos_metal_probe.mm -framework Metal -framework Foundation -o metal_probe
      - name: Run Metal probe
        run: ./metal_probe

  linux-vulkan-icd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install real Vulkan ICD and X11 surface dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb libsdl2-2.0-0
      - name: Vulkan ICD evidence
        run: |
          vulkaninfo --summary | tee vulkaninfo-summary.txt
          test -s vulkaninfo-summary.txt
      - name: Vulkan surface/present smoke
        run: |
          Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          if command -v vkcube >/dev/null 2>&1; then
            set +e
            timeout 15s vkcube --c 5 2>&1 | tee vkcube.txt
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          else
            echo VULKAN_ICD_OK_NO_VKCUBE_BINARY
          fi

  internet-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed index from public Internet endpoint
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/Naokibot/dev_1/main/registry"
          curl --fail --silent --show-error --location "$BASE/index.json" -o index.json
          curl --fail --silent --show-error --location "$BASE/index.sha256" -o index.sha256
          printf '7ebc94b8580e18d44cc88e06494d760b747a144833139ac5fbdba05c70ad45fe  index.json\n' | sha256sum -c -
          curl --fail --silent --show-error --location "$BASE/packages/saga_hello/0.1.0/package.sagapkg" -o saga_hello.sagapkg
          printf '6c34d213135bf60ba8447629ffcb2095fee8671bd1f995114419826c9d2fbc7b  saga_hello.sagapkg\n' | sha256sum -c -
          curl --fail --silent --show-error --location "$BASE/packages/saga_game_math/0.1.0/package.sagapkg" -o saga_game_math.sagapkg
          printf '13cc06ed3c1a71da0850518d739682255a98723b9fb29d4a1efda14d3d83db44  saga_game_math.sagapkg\n' | sha256sum -c -
          curl --fail --silent --show-error --location "$BASE/PUBLISHER_PUBLIC_KEY.pem" -o publisher.pem
          curl --fail --silent --show-error --location "$BASE/packages/saga_hello/0.1.0/package.sig" -o package.sig
          grep -q 'Ed25519' package.sig
          echo SAGA_PUBLIC_REGISTRY_INTERNET_OK
